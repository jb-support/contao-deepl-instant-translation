services:
    _defaults:
        autoconfigure: true
        autowire: true

    JBSupport\ContaoDeeplInstantTranslationBundle\:
        resource: ../../
        exclude: ../../{Entity,Migrations,Model,Resources,Tests,Widget}


    JBSupport\ContaoDeeplInstantTranslationBundle\EventListener\ModifyFrontendPageListener:
        tags:
            - { name: contao.hook, hook: modifyFrontendPage, method: modifyTemplate }

    JBSupport\ContaoDeeplInstantTranslationBundle\EventListener\LanguageRedirectListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 150 }

    JBSupport\ContaoDeeplInstantTranslationBundle\Service\SitemapCrawlerService:
        arguments:
            $framework: '@contao.framework'

    JBSupport\ContaoDeeplInstantTranslationBundle\Service\UrlIndexerService:
        arguments:
            $framework: '@contao.framework'

    # Ensure the Command is registered
    JBSupport\ContaoDeeplInstantTranslationBundle\Command\CrawlSitemapCommand:
        arguments:
            $crawler: '@JBSupport\ContaoDeeplInstantTranslationBundle\Service\SitemapCrawlerService'
        tags:
            - { name: 'console.command' }